# One-click deploy to Render — https://render.com
# In Render: New + → Blueprint → connect this repo → Apply.
services:
  - type: web
    name: fintract
    runtime: python
    plan: free
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DATABASE_URL
        fromDatabase:
          name: fintract-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"

databases:
  - name: fintract-db
    plan: free
    databaseName: fintract
    user: fintract
