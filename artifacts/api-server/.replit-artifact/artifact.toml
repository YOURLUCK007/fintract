kind = "api"
previewPath = "/"
title = "FinTract"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/"]

[services.development]
run = "cd /home/runner/workspace/fintract-repo/backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"

[services.production]

[services.production.build]
args = ["echo", "no-build-step"]

[services.production.run]
args = ["bash", "-c", "cd /home/runner/workspace/fintract-repo/backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/health"
